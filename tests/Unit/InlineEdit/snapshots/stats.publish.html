<div class="stats-block  " style="position:relative;"   >

<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:1.5rem;text-align:center;">
                    <div style="padding:1.5rem;border:1px solid var(--color-border,#e2e8f0);border-radius:var(--border-radius-md,0.5rem);">
            <div style="font-family:var(--font-heading,inherit);font-size:2.5rem;font-weight:700;line-height:1;color:var(--color-primary,#3b82f6);"><span  data-countup="100" >100</span></div>
            <div style="color:var(--color-text-muted,#64748b);font-size:0.875rem;margin-top:0.5rem;">Клиенти</div>
        </div>
                    <div style="padding:1.5rem;border:1px solid var(--color-border,#e2e8f0);border-radius:var(--border-radius-md,0.5rem);">
            <div style="font-family:var(--font-heading,inherit);font-size:2.5rem;font-weight:700;line-height:1;color:var(--color-primary,#3b82f6);"><span  data-countup="50" >50</span></div>
            <div style="color:var(--color-text-muted,#64748b);font-size:0.875rem;margin-top:0.5rem;">Проекти</div>
        </div>
    </div>

<script>
/* stats count-up: numbers rise from 0 when the block scrolls into view */
(function(){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var els = document.querySelectorAll('[data-countup]');
  if (!els.length || !('IntersectionObserver' in window)) return;
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      var raw = e.target.getAttribute('data-countup');
      var target = parseFloat(raw.replace(/[\s,]/g, ''));
      if (!isFinite(target)) return;
      var decimals = (raw.split('.')[1] || '').length;
      var t0 = null, dur = 1400;
      function step(ts){
        if (t0 === null) t0 = ts;
        var p = Math.min(1, (ts - t0) / dur);
        var eased = 1 - Math.pow(1 - p, 3);
        e.target.textContent = (target * eased).toFixed(decimals);
        if (p < 1) requestAnimationFrame(step); else e.target.textContent = raw;
      }
      requestAnimationFrame(step);
    });
  }, {threshold: 0.4});
  els.forEach(function(el){ io.observe(el); });
})();
</script>

</div>
